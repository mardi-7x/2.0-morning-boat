name = "morning-intelligence-bot"
main = "index.js"
compatibility_date = "2024-03-20"

[vars]
# Add these in the Cloudflare Dashboard or via 'wrangler secret put'
# NEWS_API_KEY = "..."
# NEWS_API_KEY_2 = "..."
# GEMINI_API_KEY = "..."
# GROQ_API_KEY = "..."
# BOT_TOKEN = "..."

[[kv_namespaces]]
binding = "BOT_DB"
id = "YOUR_KV_NAMESPACE_ID"

[triggers]
crons = ["0 4 * * *"] # 9:30 AM IST (approx 04:00 UTC)
